<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/signin.css">
    <title>Войти</title>
</head>
<body>
    <div class="signin">
        <div class="form__login">
            <div class="title">
                <span class="line"></span>
                <p class="text">Вход</p>
                <span class="line"></span>
            </div>
            <form class="input-log">
                <input class="login" type="email" placeholder="Введите email" novalidate>
                <small class="email-txt-hide" style="display: none;">Некорректная почта</small>
                <input class="password" type="password" placeholder="Пароль" novalidate>
                <small class="password-txt-hide" style="display: none;">Неверный пароль</small>

            <div class="btn-log_sign">
                <button type="submit" class="logIn">Войти</button>
                <button type="submit" class="signUp"><a href="signup.html">Зарегистрироваться</a></button>
            </div>
            </form>
        </div>
    </div>

    <script type="module" src="./js/signin.ts"></script>
</body>
</html>
